[package]
name = "halo"
version = "0.2.5"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "halo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-global-shortcut = "2.4.1"
tauri-plugin-store = "2.5.1"
tauri-plugin-single-instance = "2.5.5"
sysinfo = "0.40.3"
nvml-wrapper = "0.13.0"
wmi = "0.18.4"
base64 = "0.23.1"
png = "0.18.1"
windows = { version = "0.62.2", features = ["Media_Control", "Foundation", "Foundation_Collections", "Storage_Streams", "Devices_Radios", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Power", "Win32_System_Shutdown", "Win32_Foundation", "Win32_Devices_FunctionDiscovery", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_Threading", "Win32_System_SystemInformation", "Win32_UI_Controls", "Win32_System_Ole", "Win32_UI_Shell_Common", "Win32_System_LibraryLoader", "Win32_Devices_Display", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_UpdateAgent", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Diagnostics_Debug", "Win32_System_ProcessStatus"] }
windows-core = "0.62.2"
rustfft = "6.4.1"
winreg = "0.56.0"
notify = "8.2.2"
trash = "5.3.0"
rusqlite = { version = "0.42.0", features = ["bundled"] }
dns-lookup = "4.0.2"
tokio = { version = "1.54.1", features = ["time"] }
reqwest = { version = "0.13.5", default-features = false, features = ["native-tls", "json", "charset", "http2"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
